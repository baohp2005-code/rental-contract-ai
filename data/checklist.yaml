# Checklist quy tắc rủi ro. Bản khởi đầu, nhóm sửa trực tiếp.
# severity: high | medium | low
# auto: true = bước B3 kiểm tra được bằng code từ key_terms; false = để LLM đánh giá
# Căn cứ pháp lý: CẦN mentor/sinh viên luật kiểm tra trước khi dùng trong app.
rules:
  - id: DEP-01
    category: deposit
    severity: high
    auto: false
    description: Không ghi điều kiện hoặc thời hạn trả cọc
    why: Không có mốc trả cọc thì chủ nhà có thể giữ cọc lâu hoặc không trả.
    question: "Anh/chị cho em hỏi khi hết hợp đồng thì sau bao nhiêu ngày em nhận lại cọc, và trong trường hợp nào thì bị trừ cọc ạ?"
  - id: DEP-02
    category: deposit
    severity: high
    auto: false
    description: '"Mất cọc trong mọi trường hợp" khi trả phòng sớm, kể cả đã báo trước'
    why: Sinh viên hay phải chuyển chỗ giữa chừng; điều khoản này có thể làm mất toàn bộ cọc.
    question: "Nếu em báo trước 30 ngày khi chuyển đi sớm thì em có được nhận lại cọc không ạ?"
  - id: DEP-03
    category: deposit
    severity: high
    auto: false
    description: Được trừ cọc vì "hư hỏng" nhưng không có biên bản bàn giao hiện trạng
    why: Không có biên bản thì không chứng minh được hư hỏng có từ trước.
    question: "Mình có thể lập biên bản bàn giao kèm ảnh hiện trạng phòng khi em nhận phòng không ạ?"
  - id: DEP-04
    category: deposit
    severity: medium
    auto: true
    description: Cọc cao bất thường so với mặt bằng
    threshold: "deposit_months > market_norms.deposit_months_max  # ngưỡng: CHƯA CHỐT"
    why: Cọc càng cao thì rủi ro mất tiền càng lớn.
    question: "Anh/chị có thể giảm cọc xuống 1 tháng tiền nhà được không ạ?"
  - id: UTL-01
    category: utilities
    severity: high
    auto: true
    description: Ghi "giá điện theo chủ nhà quy định" hoặc cao hơn mức quy định cho người thuê
    threshold: "electricity_vnd_per_kwh > market_norms.electricity_max  # ngưỡng: CHƯA CHỐT"
    why: Giá điện không cố định có thể tăng bất kỳ lúc nào.
    question: "Giá điện cụ thể là bao nhiêu một số và có ghi cố định trong hợp đồng được không ạ?"
  - id: UTL-02
    category: utilities
    severity: medium
    auto: false
    description: Phí dịch vụ không ghi gồm những gì; nước tính theo người hay theo khối không rõ
    why: Phí mơ hồ dễ phát sinh tranh cãi hàng tháng.
    question: "Phí dịch vụ gồm những khoản nào, và nước tính theo người hay theo đồng hồ ạ?"
  - id: RNT-01
    category: rent
    severity: high
    auto: false
    description: Chủ nhà được tăng giá bất kỳ lúc nào, không báo trước
    why: Tiền thuê có thể tăng giữa hợp đồng mà người thuê không kịp chuẩn bị.
    question: "Trong thời hạn hợp đồng giá thuê có giữ nguyên không, nếu tăng thì báo trước bao lâu ạ?"
  - id: RNT-02
    category: rent
    severity: medium
    auto: false
    description: Phạt chậm trả quá nặng
    why: Mức phạt cao có thể vượt xa số tiền chậm trả.
    question: "Nếu em chậm vài ngày thì mức phạt cụ thể là bao nhiêu ạ?"
  - id: REP-01
    category: repairs
    severity: high
    auto: false
    description: Người thuê chịu mọi khoản sửa chữa, kể cả hư hỏng lớn hoặc hao mòn tự nhiên
    why: Hỏng điều hòa, bình nóng lạnh có thể tốn vài triệu đồng.
    question: "Những hư hỏng do thiết bị cũ hoặc hao mòn tự nhiên thì bên nào chịu chi phí sửa ạ?"
  - id: TRM-01
    category: termination
    severity: high
    auto: false
    description: Chủ nhà được tự ý chấm dứt không cần báo trước, còn người thuê thì mất cọc
    why: Bất cân xứng; người thuê có thể mất chỗ ở đột ngột.
    question: "Nếu anh/chị cần lấy lại phòng trước hạn thì sẽ báo trước bao lâu và hoàn cọc thế nào ạ?"
  - id: TRM-02
    category: termination
    severity: medium
    auto: true
    description: Không ghi thời hạn báo trước
    why: Không rõ phải báo trước bao lâu thì dễ bị coi là vi phạm.
    question: "Khi muốn chấm dứt hợp đồng thì mỗi bên cần báo trước bao nhiêu ngày ạ?"
  - id: OTH-01
    category: other
    severity: medium
    auto: false
    description: Không có danh sách đồ đạc hoặc biên bản hiện trạng
    why: Dễ bị quy trách nhiệm cho đồ đạc hỏng hoặc thiếu.
    question: "Mình có thể ghi danh sách đồ đạc trong phòng vào hợp đồng không ạ?"
  - id: OTH-02
    category: other
    severity: medium
    auto: false
    description: Chủ nhà được vào phòng bất kỳ lúc nào
    why: Ảnh hưởng quyền riêng tư và an toàn tài sản.
    question: "Khi cần vào phòng, anh/chị có thể báo trước cho em được không ạ?"
  - id: OTH-03
    category: other
    severity: medium
    auto: false
    description: Không rõ người cho thuê có phải chủ nhà thật không (có thể là người cho thuê lại)
    why: Người cho thuê lại không có quyền thì hợp đồng có thể không được chủ nhà công nhận.
    question: "Anh/chị là chủ nhà hay đang cho thuê lại ạ? Em có thể xem giấy tờ liên quan không ạ?"
  - id: OTH-04
    category: other
    severity: low
    auto: false
    description: Không nhắc tới đăng ký tạm trú
    why: Sinh viên cần đăng ký tạm trú; cần chủ nhà hỗ trợ giấy tờ.
    question: "Anh/chị có hỗ trợ em đăng ký tạm trú không ạ?"

legal_refs:  # CẦN KIỂM TRA số điều và hiệu lực
  - Bộ luật Dân sự 2015, Điều 328 (đặt cọc); hợp đồng thuê tài sản từ Điều 472
  - Luật Nhà ở 2023
  - Luật Cư trú (đăng ký tạm trú)
  - Quy định của Bộ Công Thương về giá điện cho người thuê nhà
